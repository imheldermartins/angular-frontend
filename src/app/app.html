<div class="w-full h-svh flex flex-row">

  <div class="w-64 flex flex-col gap-1 bg-slate-200 border-r border-slate-300 p-4">
    @for (link of navLinks; track link.routerLink) {
      <a typography [routerLink]=[link.routerLink]>{{ link.label }}</a>
    }
  </div>

  <main class="flex-1 h-full p-4">
    <router-outlet />
  </main>
</div>
